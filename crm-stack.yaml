apiVersion: v1
kind: Namespace
metadata:
  name: jobentra-crm
---
# ==========================================
# 0. NFS SPEICHER FÜR DOKUMENTE (appdata)
# ==========================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-appdata-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  nfs:
    server: 192.168.20.62
    path: /data/nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-appdata-pvc
  namespace: jobentra-crm
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
# ==========================================
# 1. AI-SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: jobentra-crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      imagePullSecrets:
      - name: gitea-registry-secret
      containers:
      - name: ai-service
        image: git.ad.jobentra.de/salih/crm-ai-service:92b92f9
        ports:
        - containerPort: 8000
        env:
        - name: AI_SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: AI_API_KEY
        - name: ALLOWED_ORIGINS
          value: "http://backend:8080,http://localhost:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: jobentra-crm
spec:
  selector:
    app: ai-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
# ==========================================
# 2. BACKEND (Spring Boot)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jobentra-crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: gitea-registry-secret
      containers:
      - name: backend
        image: git.ad.jobentra.de/salih/crm-backend:92b92f9
        ports:
        - containerPort: 8080
        env:
        - name: DEMO_EMAIL
          value: "admin@jobentra.de"
        - name: DEMO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: DEMO_PASSWORD
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres.ad.jobentra.de:5432/crm_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "crm_backend"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: DB_PASSWORD
        - name: AI_SERVICE_URL
          value: "http://ai-service:8000"
        - name: AI_SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: AI_API_KEY
        - name: CANDIDATE_FILES_PATH
          value: "/data/candidates"
        volumeMounts:
        - name: documents-volume
          mountPath: /data/candidates
      volumes:
      - name: documents-volume
        persistentVolumeClaim:
          claimName: nfs-appdata-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: jobentra-crm
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
# ==========================================
# 3. FRONTEND (Next.js)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: jobentra-crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: gitea-registry-secret
      containers:
      - name: frontend
        image: git.ad.jobentra.de/salih/crm-frontend:92b92f9
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_URL
          value: "http://backend:8080"
        - name: ALLOWED_DEV_ORIGINS
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: ALLOWED_DEV_ORIGINS
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: jobentra-crm
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
# ==========================================
# 4. INGRESS
# ==========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crm-ingress
  namespace: jobentra-crm
spec:
  ingressClassName: traefik
  rules:
  - host: crm.ad.jobentra.de
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
