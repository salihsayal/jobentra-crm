services:
  postgres:
    image: postgres:15-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Geändert auf ein lokales Verzeichnis (Bind-Mount)
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - jobentra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  jobentra-network:
    name: jobentra-network

# Den separaten "volumes:" Block unten kannst du komplett löschen!
