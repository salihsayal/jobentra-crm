services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      DEMO_EMAIL: ${DEMO_EMAIL}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      CANDIDATE_FILES_PATH: /data/candidates
    ports:
      - "8080:8080"
    volumes:
      - ./appdata/documents:/data/candidates
    networks:
      - jobentra-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: crm-ai-service
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      AI_SERVICE_PUBLIC_URL: ${AI_SERVICE_PUBLIC_URL}
      ALLOWED_ORIGINS: http://backend:8080,http://localhost:8080
    ports:
      - "8000:8000"
    networks:
      - jobentra-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    networks:
      - jobentra-network
    depends_on:
      - backend

networks:
  jobentra-network:
    external: true
    name: jobentra-network
