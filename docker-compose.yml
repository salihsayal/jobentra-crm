services:
  postgres:
    image: postgres:15-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - jobentra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      DEMO_EMAIL: ${DEMO_EMAIL}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      CANDIDATE_FILES_PATH: /data/candidates
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-15}
    ports:
      - "8080:8080"
    volumes:
      - ./appdata/documents:/data/candidates
    networks:
      - jobentra-network
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: crm-ai-service
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      AI_SERVICE_PUBLIC_URL: ${AI_SERVICE_PUBLIC_URL}
      ALLOWED_ORIGINS: http://backend:8080,http://localhost:8080
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/secrets/crm-gemini-runner.json}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-jobentra-crm-505722}
      GCP_LOCATION: ${GCP_LOCATION:-europe-west3}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
    ports:
      - "8000:8000"
    volumes:
      - ./secrets/crm-gemini-runner.json:/app/secrets/crm-gemini-runner.json:ro
    networks:
      - jobentra-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    environment:
      BACKEND_URL: http://backend:8080
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-localhost:3000,127.0.0.1:3000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    networks:
      - jobentra-network
    depends_on:
      - backend

volumes:
  pgdata:

networks:
  jobentra-network:
    driver: bridge
